version: '3.3'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  nifi:
    image: apache/nifi:1.23.2
    container_name: nifi
    hostname: nifi
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      NIFI_WEB_HTTP_PORT: 8080
    volumes:
      - ./nifi_templates:/opt/nifi/nifi-current/templates

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ./:/opt/project

  hbase:
    image: harisekhon/hbase
    container_name: hbase
    hostname: hbase
    depends_on:
      - zookeeper
    ports:
      - "9090:9090"
      - "16000:16000"
      - "16010:16010"
      - "16020:16020"
      - "16030:16030"
    environment:
      HBASE_MANAGES_ZK: "false"
    volumes:
      - ./hbase-data:/hbase-data
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    container_name: namenode
    hostname: namenode
    ports:
      - "50070:50070"
      - "8020:8020"
    environment:
      CLUSTER_NAME: hive-cluster
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
    volumes:
      - namenode-data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    container_name: datanode
    hostname: datanode
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:50070"
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
    volumes:
      - datanode-data:/hadoop/dfs/data
  postgres:
    image: postgres:13
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5432:5432"

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    hostname: hive-metastore
    depends_on:
      - postgres
      - namenode
      - datanode
    ports:
      - "9083:9083"
    environment:
      HADOOP_HOME: /opt/hadoop-2.7.4
      HADOOP_CONF_DIR: /opt/hadoop-2.7.4/etc/hadoop

      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: jdbc:postgresql://postgres/metastore
      HIVE_CORE_CONF_javax_jdo_option_ConnectionDriverName: org.postgresql.Driver
      HIVE_CORE_CONF_javax_jdo_option_ConnectionUserName: hive
      HIVE_CORE_CONF_javax_jdo_option_ConnectionPassword: hive
    volumes:
      - ./hive:/opt/hive_scripts
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    hostname: hive-server
    depends_on:
      - hive-metastore
      - namenode
      - datanode
    ports:
      - "10000:10000"
    environment:
      HADOOP_HOME: /opt/hadoop-2.7.4
      HADOOP_CONF_DIR: /opt/hadoop-2.7.4/etc/hadoop

      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: jdbc:postgresql://postgres/metastore
      HIVE_CORE_CONF_javax_jdo_option_ConnectionDriverName: org.postgresql.Driver
      HIVE_CORE_CONF_javax_jdo_option_ConnectionUserName: hive
      HIVE_CORE_CONF_javax_jdo_option_ConnectionPassword: hive

      SERVICE_PRECONDITION: "hive-metastore:9083"
    volumes:
      - ./hive:/opt/hive_scripts  
  airflow:
    image: apache/airflow:2.7.3
    container_name: airflow
    hostname: airflow
    depends_on:
      - postgres
    ports:
      - "8082:8080"
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
volumes:
  namenode-data:
  datanode-data: